<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Development Streak</title>
        <link rel="stylesheet" href="Style.css">
    </head>
    <body>
        <div class="container">
            <aside class="sidebar">
                <h3>Categories</h3>
                <div class="sidebar-item active" data-section="tasks">Tasks</div>
                <div class="sidebar-item" data-section="completed">Completed</div>
                <div class="sidebar-item" data-section="in-progress">In Progress</div>
                <div class="sidebar-item" data-section="overdue">Overdue</div>
            </aside>

            <main>
                <header id="catogerie"></header>
                <form id="task-form" >
                    <p>Add Tasks</p>
                    <input type="text" id="task-input" placeholder="Enter a task" required>
                    <input type="date" id="due-date" required>
                    <button  type="button" id="addButton">Add Task</button>
                </form>
                <form id="search-form" >
                    <input type="text" id="search-input" placeholder="Search tasks">
                </form>
                <div id="task-list">
                </div>
            </main>
            <div id="edit-card" class="edit-card hidden">

                <h2>Edit Task</h2>

                <label for="edit-title">Task title</label>
                <input type="text" id="edit-title">

                <label for="edit-date">Due date</label>
                <input type="date" id="edit-date">

                <div class="edit-actions">
                    <button id="cancel-edit">Cancel</button>
                    <button id="save-edit">Save Changes</button>
            </div>

        </div>
        <script src="logic.js"></script>
    </body>

</html>
